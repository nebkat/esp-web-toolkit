<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP Web Toolkit</title>
  <!--
    The site root (see 404.html): opens the latest version, keeping the
    query and fragment. The oldest one-click links put the route in the
    fragment (#/oneclick?bundle=…); they become the path form. The Pages
    workflow fills in LATEST when it publishes.
  -->
  <script>
    var LATEST = 'v0.2.0';
    location.replace(location.hash.indexOf('#/') === 0
      ? LATEST + '/?p=' + encodeURIComponent(location.hash.slice(1))
      : LATEST + '/' + location.search + location.hash);
  </script>
</head>
<body>
  <p><a href="v0.2.0/">ESP Web Toolkit</a></p>
</body>
</html>
