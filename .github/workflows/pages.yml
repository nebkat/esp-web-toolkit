# Publishes a version of apps/esp_web_toolkit to GitHub Pages when it is tagged
# esp_web_toolkit/v<version>: the app is built with base href /<repo>/v<version>/
# and committed to the gh-pages branch as that folder, next to every earlier
# version. A published version is never replaced, so a link to it keeps
# working however later versions behave.
#
# CanvasKit and the fallback fonts load from Google's CDN (Flutter's default),
# so the canvaskit/ folder of the build is not published.
#
# The branch root holds apps/esp_web_toolkit/pages: 404.html sends deep links
# (/v1.2.3/oneclick) to their version, and unversioned links, with their
# query and fragment, to the latest published version.
name: Pages

on:
  push:
    tags: ['esp_web_toolkit/v*']

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Version and Flutter from the repository
        run: |
          version="${GITHUB_REF_NAME#esp_web_toolkit/}"
          pubspec="v$(sed -n 's/^version: *\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' apps/esp_web_toolkit/pubspec.yaml)"
          if [ "$version" != "$pubspec" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/esp_web_toolkit/pubspec.yaml ($pubspec)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter }}
          cache: true

      - run: flutter pub get

      - run: flutter build web --release --web-resources-cdn --base-href "/${GITHUB_REPOSITORY#*/}/${{ steps.version.outputs.version }}/"
        working-directory: apps/esp_web_toolkit

      - name: Publish to gh-pages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          site="$RUNNER_TEMP/site"
          if git fetch --depth=1 origin gh-pages:gh-pages; then
            git worktree add "$site" gh-pages
          else
            git worktree add --orphan -b gh-pages "$site"
          fi
          if [ -e "$site/$VERSION" ]; then
            echo "::error::$VERSION is already published"
            exit 1
          fi
          cp -R apps/esp_web_toolkit/build/web "$site/$VERSION"
          rm -rf "$site/$VERSION/canvaskit"
          cp apps/esp_web_toolkit/pages/index.html apps/esp_web_toolkit/pages/404.html "$site/"
          # The highest version published, not necessarily this one.
          latest=$(cd "$site" && ls -d v*/ | tr -d / | sort -V | tail -n 1)
          sed -i "s/%LATEST%/$latest/g" "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"
          cd "$site"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish $VERSION"
          git push origin gh-pages
