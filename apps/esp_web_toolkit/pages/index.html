<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP Web Toolkit</title>
  <!--
    The site root (see 404.html): opens the latest version, keeping the
    query and fragment. The fragment (#/flash?remote=…) stays a fragment,
    so what it carries never reaches the server. The Pages workflow fills
    in LATEST when it publishes.
  -->
  <script>
    var LATEST = '%LATEST%';
    location.replace(LATEST + '/' + location.search + location.hash);
  </script>
</head>
<body>
  <p><a href="%LATEST%/">ESP Web Toolkit</a></p>
</body>
</html>
